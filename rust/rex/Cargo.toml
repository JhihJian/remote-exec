[package]
name = "remote-exec-rex"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rex"
path = "src/main.rs"

[features]
default = []
ops = [
    "dep:remote-exec-ssh",
    "dep:rpassword",
    "dep:russh",
    "dep:russh-sftp",
    "dep:rustls",
    "dep:rustls-pemfile",
]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
remote-exec-ssh = { path = "../ssh", optional = true }
remote-exec-tls = { path = "../tls" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rpassword = { version = "7", optional = true }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring"], optional = true }
russh-sftp = { version = "3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", default-features = false, features = ["std"], optional = true }
rustls-pki-types = { version = "1", default-features = false }
rustyline = { version = "19", default-features = false, features = ["custom-bindings"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }
rand = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "fs", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[dev-dependencies]
tempfile = "3"
