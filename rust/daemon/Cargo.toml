[package]
name = "remote-exec-daemon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "remote-execd"
path = "src/main.rs"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = { version = "0.2", default-features = false }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tar = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "fs", "process", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "connect", "__rustls-tls"] }
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["std", "ring"] }
