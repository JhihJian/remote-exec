name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install install-test prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Build Linux x64 package
        run: bash scripts/build-release.sh --output-dir dist

      - name: Build Rust core and ops packages
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --workspace --all-features
          bash scripts/build-rust-release.sh --arch x64 --output-dir dist/rust

      - name: Run tests
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/remote-exec-linux-x64.tar.gz
        run: npm test

      - name: Verify real systemd install and reboot
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/remote-exec-linux-x64.tar.gz
          INSTALL_SYSTEMD: '1'
        run: |
          docker build -t remote-exec-install-systemd:test test/install
          npm run test:install

      - name: Verify SSH direct and gateway deployment
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/remote-exec-linux-x64.tar.gz
        run: npm run test:deploy

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$PACKAGE_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-exec-linux-x64
          path: |
            dist/remote-exec-linux-x64.tar.gz
            dist/remote-exec-linux-x64.tar.gz.sha256
            dist/rust/*.tar.gz
            dist/rust/*.tar.gz.sha256
            dist/rust/size.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            dist/remote-exec-linux-x64.tar.gz \
            dist/remote-exec-linux-x64.tar.gz.sha256 \
            dist/rust/*.tar.gz \
            dist/rust/*.tar.gz.sha256 \
            dist/rust/size.json \
            scripts/install.sh
