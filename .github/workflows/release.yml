name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$PACKAGE_VERSION"

      - name: Build Linux x64 package
        run: bash scripts/build-release.sh --output-dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-exec-linux-x64
          path: |
            dist/remote-exec-linux-x64.tar.gz
            dist/remote-exec-linux-x64.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            dist/remote-exec-linux-x64.tar.gz \
            dist/remote-exec-linux-x64.tar.gz.sha256 \
            scripts/install.sh
