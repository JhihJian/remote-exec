[package]
name = "remote-exec-tls"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1", default-features = false }
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["std", "ring"] }
