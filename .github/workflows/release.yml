name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust release prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools openssl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Build Rust core and ops packages
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --workspace --all-features
          bash scripts/build-rust-release.sh --arch all --output-dir dist/rust

      - name: Build Rust integration image
        run: docker build -t remote-exec-deploy:test -f test/deploy/Dockerfile test/deploy

      - name: Run Rust protocol and lifecycle tests
        run: |
          npm run test:rust
          npm run test:rust-drain
          npm run test:rust-supervisor

      - name: Verify Rust formal installation
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/rust/remote-exec-linux-x64.tar.gz
        run: npm run test:rust-install

      - name: Verify Rust direct deployment and zero-downtime upgrade
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/rust/remote-exec-linux-x64.tar.gz
        run: npm run test:rust-deploy

      - name: Verify Rust gateway deployment
        env:
          INSTALL_PACKAGE: ${{ github.workspace }}/dist/rust/remote-exec-linux-x64.tar.gz
        run: npm run test:rust-gateway

      - name: Verify Rust supervisor upgrade protocol
        run: npm run test:rust-upgrade

      - name: Verify retained Pi host adapter
        run: npm run typecheck && npm run test:extension

      - name: Verify architecture state
        run: node .agents/architecture-governance/check-state.mjs check --require-active

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$PACKAGE_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-exec-rust
          path: |
            dist/rust/*.tar.gz
            dist/rust/*.tar.gz.sha256
            dist/rust/size.json
            rust/packaging/install.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            dist/rust/*.tar.gz \
            dist/rust/*.tar.gz.sha256 \
            dist/rust/size.json \
            rust/packaging/install.sh
